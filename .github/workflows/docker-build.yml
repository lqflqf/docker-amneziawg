name: Build and Push Docker Image

# Versioning: every image published from the default branch is a release
# v<amneziawg-tools>-r<N> (e.g. v3.1.20260812-r2). N counts builds of that tools
# version and is stored in git as an annotated tag, which also records the run
# id that produced it. One release == one immutable image tag <tools>-r<N>;
# <tools> and latest are floating aliases to the newest release.
#
# Modes (decided in the `changes` job):
#   pr      pull requests: smoke tests only, nothing pushed
#   release push to the default branch, or manual run on it without version
#           overrides: push <tools>-r<N>, <tools>, latest, sha-* and create
#           the tag + GitHub Release
#   adhoc   manual run with version overrides: push dispatch-<run> only;
#           push to a non-default master/main, or manual run on another
#           branch without overrides: sha-* (+ dispatch-<run> if manual).
#           Never latest, never a release
#
# sha-<short> always means "built from this commit's own Dockerfile pins", so
# builds with version overrides must not claim it.
#
# A release run that is superseded (a later run already published a release,
# e.g. when an old failed run is re-run) still publishes its immutable
# <tools>-r<N> and GitHub Release, but never moves the floating aliases or the
# "latest" release back to itself.
#
# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) bumps them.

on:
  workflow_dispatch:
    inputs:
      amneziawg_go_version:
        description: 'amneziawg-go version (e.g., v0.2.16) — overrides make an ad-hoc build, not a release'
        required: false
      amneziawg_tools_version:
        description: 'amneziawg-tools version (e.g., v1.0.20260223) — overrides make an ad-hoc build, not a release'
        required: false
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# Publishing runs claim the next build number from git tags, so they must not
# overlap: two merges racing would compute the same -rN. A queued publishing
# run that GitHub replaces with a newer one loses nothing, because the image
# diff below is taken against the last release, not against the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1
  # Upstream versions are read from the Dockerfile ARG pins (single source of truth).
  # workflow_dispatch inputs override them for one-off (ad-hoc) builds.

jobs:
  # Decide the mode, and whether this event touches the image at all. Only
  # Dockerfile, root/, .dockerignore and the CI that versions the image end up
  # in (or shape) the published image — docs, skills and compose examples do
  # not, so a push that changes only those must not publish a new release.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      mode: ${{ steps.filter.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide mode and whether image-affecting paths changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GO_INPUT: ${{ inputs.amneziawg_go_version }}
          TOOLS_INPUT: ${{ inputs.amneziawg_tools_version }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          IMAGE_PATHS='^(Dockerfile$|root/|\.dockerignore$|\.github/workflows/docker-build\.yml$|\.github/scripts/)'

          if [[ "$EVENT" == "pull_request" ]]; then
            MODE="pr"
          elif [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" && -z "${GO_INPUT}${TOOLS_INPUT}" ]]; then
            MODE="release"
          else
            MODE="adhoc"
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

          decide() {
            echo "image=$1" >> "$GITHUB_OUTPUT"
            echo "mode: ${MODE}, build: $2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Manual runs always build. Base images are pinned by digest, so a
          # base-image refresh arrives as a (Dependabot) Dockerfile change; a
          # manual run rebuilds the same pins, e.g. to retry a release.
          [[ "$EVENT" == "workflow_dispatch" ]] && decide true "yes (manual run)"

          if [[ "$MODE" == "pr" ]]; then
            BASE="$PR_BASE"
          elif [[ "$MODE" == "release" ]]; then
            # Compare against the last release rather than the previous push,
            # so image changes from a failed or superseded run are not lost.
            # The last release is the one `latest` serves, whether or not the
            # branch still contains it: after a force-push back to an older
            # tree, a diff against an older reachable tag would miss that
            # the published image no longer matches the branch.
            BASE=$(.github/scripts/release-tags.sh latest)
            [[ -n "$BASE" ]] || decide true "yes (no previous release)"
            # A re-run of a run that already created a release tag has to
            # finish its release (e.g. the tag was pushed but the release step
            # failed), even if a later run has released since.
            # grep without -q: an early exit would SIGPIPE git, and the step
            # shell's pipefail would turn a match into a failure.
            if git tag -l --format='%(contents)' 'v*-r*' | grep -x "run-id: ${GITHUB_RUN_ID}" >/dev/null; then
              decide true "yes (re-run of a run that already tagged a release)"
            fi
            echo "last release: ${BASE}"
          else
            BASE="$PUSH_BEFORE"
          fi
          HEAD="${PR_HEAD:-$GITHUB_SHA}"

          # New branch or force-push where the old tip is gone: no diff to
          # inspect, so fail open and build.
          if [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            decide true "yes (no comparable base commit)"
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files since ${BASE}:"; awk '{print "  " $0}' <<<"$CHANGED"
          if grep -qE "$IMAGE_PATHS" <<<"$CHANGED"; then
            decide true "yes (image-affecting paths changed since ${BASE})"
          fi
          decide false "skipped — no changes to Dockerfile, root/, .dockerignore or image CI since ${BASE}"

  # Resolve upstream versions and the image version once; build and release
  # both consume these outputs so the tag, image and release cannot disagree.
  version:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    outputs:
      amneziawg_go: ${{ steps.versions.outputs.amneziawg_go }}
      amneziawg_tools: ${{ steps.versions.outputs.amneziawg_tools }}
      amneziawg_go_commit: ${{ steps.versions.outputs.amneziawg_go_commit }}
      amneziawg_tools_commit: ${{ steps.versions.outputs.amneziawg_tools_commit }}
      tools_version: ${{ steps.versions.outputs.tools_version }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the build counter is read from the release tags
          fetch-depth: 0
          persist-credentials: false

      - name: Test the release scripts
        if: needs.changes.outputs.mode == 'pr'
        run: |
          .github/scripts/next-version.test.sh
          .github/scripts/release-tags.test.sh

      - name: Resolve versions
        id: versions
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          EVENT: ${{ github.event_name }}
          GO_INPUT: ${{ inputs.amneziawg_go_version }}
          TOOLS_INPUT: ${{ inputs.amneziawg_tools_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # workflow_dispatch inputs take precedence; otherwise read the pins from the Dockerfile
          AWG_GO="${GO_INPUT:-$(grep '^ARG AMNEZIAWG_GO_VERSION=' Dockerfile | cut -d= -f2)}"
          AWG_TOOLS="${TOOLS_INPUT:-$(grep '^ARG AMNEZIAWG_TOOLS_VERSION=' Dockerfile | cut -d= -f2)}"
          # The commit pins belong to the pinned versions; an override is an
          # ad-hoc build of whatever the tag points at, so it verifies nothing.
          GO_COMMIT=""
          TOOLS_COMMIT=""
          [[ -z "$GO_INPUT" ]] && GO_COMMIT=$(grep '^ARG AMNEZIAWG_GO_COMMIT=' Dockerfile | cut -d= -f2)
          [[ -z "$TOOLS_INPUT" ]] && TOOLS_COMMIT=$(grep '^ARG AMNEZIAWG_TOOLS_COMMIT=' Dockerfile | cut -d= -f2)
          if [[ -z "$AWG_GO" || -z "$AWG_TOOLS" ]]; then
            echo "::error::Could not resolve upstream versions (go: '${AWG_GO}', tools: '${AWG_TOOLS}')"
            exit 1
          fi
          # Strip 'v' prefix for image tags (v1.0.20260223 -> 1.0.20260223)
          TOOLS_VERSION="${AWG_TOOLS#v}"

          case "$MODE" in
            release)
              RESULT=$(.github/scripts/next-version.sh "$AWG_TOOLS" "$GITHUB_RUN_ID")
              VERSION=$(sed -n 's/^version=//p' <<<"$RESULT")
              REUSED=$(sed -n 's/^reused=//p' <<<"$RESULT")
              ;;
            pr)
              VERSION="${TOOLS_VERSION}-pr${PR_NUMBER}"
              ;;
            *)
              if [[ "$EVENT" == "workflow_dispatch" ]]; then
                VERSION="${TOOLS_VERSION}-dispatch${GITHUB_RUN_NUMBER}"
              else
                VERSION="${TOOLS_VERSION}-sha${GITHUB_SHA::7}"
              fi
              ;;
          esac

          {
            echo "amneziawg_go=${AWG_GO}"
            echo "amneziawg_tools=${AWG_TOOLS}"
            echo "amneziawg_go_commit=${GO_COMMIT}"
            echo "amneziawg_tools_commit=${TOOLS_COMMIT}"
            echo "tools_version=${TOOLS_VERSION}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Build versions"
            echo "- image: \`${VERSION}\` (${MODE}${REUSED:+, reused by re-run: ${REUSED}})"
            echo "- amneziawg-go: \`${AWG_GO}\` ${GO_COMMIT:+(\`${GO_COMMIT}\`)}"
            echo "- amneziawg-tools: \`${AWG_TOOLS}\` ${TOOLS_COMMIT:+(\`${TOOLS_COMMIT}\`)}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Every run: build one platform locally, smoke-test it and scan it. Nothing is
  # published unless this passes. Kept apart from `build` so it never holds a
  # package-write token.
  smoke:
    needs: [changes, version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build test image (linux/amd64)
        env:
          IMAGE_VERSION: ${{ needs.version.outputs.version }}
          AWG_GO: ${{ needs.version.outputs.amneziawg_go }}
          AWG_TOOLS: ${{ needs.version.outputs.amneziawg_tools }}
          AWG_GO_COMMIT: ${{ needs.version.outputs.amneziawg_go_commit }}
          AWG_TOOLS_COMMIT: ${{ needs.version.outputs.amneziawg_tools_commit }}
        run: |
          docker build -t test-image \
            --build-arg VERSION="$IMAGE_VERSION" \
            --build-arg AMNEZIAWG_GO_VERSION="$AWG_GO" \
            --build-arg AMNEZIAWG_GO_COMMIT="$AWG_GO_COMMIT" \
            --build-arg AMNEZIAWG_TOOLS_VERSION="$AWG_TOOLS" \
            --build-arg AMNEZIAWG_TOOLS_COMMIT="$AWG_TOOLS_COMMIT" \
            .

      - name: Smoke tests
        run: .github/scripts/smoke-test.sh test-image

      # Fails on critical vulnerabilities that already have a fix, so a
      # release never ships one that a rebuild would remove.
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test-image
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  build:
    needs: [changes, version, smoke]
    if: needs.changes.outputs.mode != 'pr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MODE: ${{ needs.changes.outputs.mode }}
      IMAGE_VERSION: ${{ needs.version.outputs.version }}
      TOOLS_VERSION: ${{ needs.version.outputs.tools_version }}
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release tags decide whether this run has been superseded
          fetch-depth: 0
          persist-credentials: false

      # Evaluated here, not in `version`: "re-run failed jobs" reuses the
      # outputs of jobs that succeeded, which may predate a newer release.
      - name: Check whether a later run has already released
        id: superseded
        if: env.MODE == 'release'
        run: |
          SUPERSEDED=$(.github/scripts/release-tags.sh superseded "$GITHUB_RUN_ID")
          echo "superseded=${SUPERSEDED}" >> "$GITHUB_OUTPUT"
          if [[ "$SUPERSEDED" == "true" ]]; then
            echo "::warning::A later run has already released $(.github/scripts/release-tags.sh latest); publishing ${IMAGE_VERSION} without moving ${TOOLS_VERSION}, latest or sha-*"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          platforms: linux/amd64,linux/arm64
          config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # <tools>-r<N> is immutable. If it already exists it must be this run's
      # own push (a re-run after a later step failed): reuse it instead of
      # rebuilding. Anything else means the counter and the registry disagree,
      # and overwriting would silently change a published release.
      - name: Check the release tag is not taken
        id: existing
        if: env.MODE == 'release'
        run: |
          REF="${REGISTRY}/${IMAGE_NAME,,}:${IMAGE_VERSION}"
          if ! IMAGE_JSON=$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' 2>/tmp/inspect.err); then
            if grep -qiE 'not found|manifest unknown' /tmp/inspect.err; then
              echo "${REF} does not exist yet — building it."
              exit 0
            fi
            cat /tmp/inspect.err
            echo "::error::Could not check whether ${REF} already exists"
            exit 1
          fi
          OWNER=$(jq -r 'if has("config") then . else first(.[]) end | .config.Labels["io.github.actions.run-id"] // empty' <<<"$IMAGE_JSON")
          if [[ "$OWNER" != "$GITHUB_RUN_ID" ]]; then
            echo "::error::${REF} already exists (pushed by run ${OWNER:-unknown}, this is run ${GITHUB_RUN_ID}). Refusing to overwrite a published image tag. If run ${OWNER:-unknown} failed before creating its release, re-run its failed jobs to finish it (this run can then be re-run and will take the next number); otherwise delete the orphaned image tag."
            exit 1
          fi
          # The earlier attempt may have died mid-push: only reuse a complete
          # multi-arch index.
          # Attestation manifests are listed as unknown/unknown; skip them.
          PLATFORMS=$(docker buildx imagetools inspect "$REF" --raw \
            | jq -r '[.manifests[]?.platform | select(. != null and .os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
          if [[ "$PLATFORMS" != "linux/amd64,linux/arm64" ]]; then
            echo "::error::${REF} was pushed by this run but has platforms '${PLATFORMS}', expected linux/amd64,linux/arm64. Delete the image tag and re-run."
            exit 1
          fi
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "- reusing ${REF}@${DIGEST} pushed by this run's earlier attempt" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # Immutable release tag (e.g., 3.1.20260812-r2)
            type=raw,value=${{ env.IMAGE_VERSION }},enable=${{ env.MODE == 'release' }},priority=1000
            # Floating alias: newest release of this amneziawg-tools version (e.g., 3.1.20260812)
            type=raw,value=${{ env.TOOLS_VERSION }},enable=${{ env.MODE == 'release' && steps.superseded.outputs.superseded != 'true' }}
            # Floating alias: newest release
            type=raw,value=latest,enable=${{ env.MODE == 'release' && steps.superseded.outputs.superseded != 'true' }}
            # Ad-hoc manual runs (version overrides)
            type=raw,value=dispatch-${{ github.run_number }},enable=${{ env.MODE == 'adhoc' && github.event_name == 'workflow_dispatch' }}
            # Tag with short sha — only for builds that match the commit's source
            type=sha,prefix=sha-,enable=${{ format('{0}{1}', inputs.amneziawg_go_version, inputs.amneziawg_tools_version) == '' && steps.superseded.outputs.superseded != 'true' }}
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            io.github.actions.run-id=${{ github.run_id }}

      # The smoke job only ran amd64. Build arm64 on its own first (the layers
      # land in the cache the multi-arch push below reuses) and check that its
      # binaries actually run, so a broken arm64 image is never published.
      - name: Build linux/arm64 for a runtime check
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: arm64-check
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            AMNEZIAWG_GO_VERSION=${{ needs.version.outputs.amneziawg_go }}
            AMNEZIAWG_GO_COMMIT=${{ needs.version.outputs.amneziawg_go_commit }}
            AMNEZIAWG_TOOLS_VERSION=${{ needs.version.outputs.amneziawg_tools }}
            AMNEZIAWG_TOOLS_COMMIT=${{ needs.version.outputs.amneziawg_tools_commit }}
          provenance: false
          sbom: false

      - name: Runtime check (linux/arm64)
        if: steps.existing.outputs.digest == ''
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/bash arm64-check -euc '
            awg --version
            amneziawg-go --version
            unbound -V | head -n1
            test "$(uname -m)" = aarch64
            awg genkey | awg pubkey >/dev/null
            bash -n /etc/s6-overlay/s6-rc.d/init-amneziawg-confs/run
          '

      - name: Build and push
        id: push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ env.IMAGE_VERSION }}
            AMNEZIAWG_GO_VERSION=${{ needs.version.outputs.amneziawg_go }}
            AMNEZIAWG_GO_COMMIT=${{ needs.version.outputs.amneziawg_go_commit }}
            AMNEZIAWG_TOOLS_VERSION=${{ needs.version.outputs.amneziawg_tools }}
            AMNEZIAWG_TOOLS_COMMIT=${{ needs.version.outputs.amneziawg_tools_commit }}
            BUILDKIT_INLINE_CACHE=1
          # SLSA provenance and an SBOM are attached to the image index.
          provenance: mode=max
          sbom: true

      # A push of several tags is not atomic: the earlier attempt may have
      # published <tools>-r<N> but not the aliases. Point every alias at the
      # reused digest (idempotent when they are already right).
      - name: Repair aliases of the reused image
        if: steps.existing.outputs.digest != ''
        env:
          DIGEST: ${{ steps.existing.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          ARGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            [[ "${tag,,}" == "${IMAGE}:${IMAGE_VERSION}" ]] && continue
            ARGS+=(-t "$tag")
          done <<<"$TAGS"
          if (( ${#ARGS[@]} == 0 )); then
            echo "No aliases to repair."
            exit 0
          fi
          docker buildx imagetools create "${ARGS[@]}" "${IMAGE}@${DIGEST}"
          awk '{print "- alias: " $0}' <<<"$TAGS" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize pushed image
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Pushed \`${IMAGE_VERSION}\`"
            echo "- digest: \`${DIGEST}\`"
            awk '{print "- tag: " $0}' <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tag first, then release: the annotated tag is the build counter and records
  # the run id and digest, so a re-run can tell its own tag from someone else's.
  # Tags created with GITHUB_TOKEN do not trigger workflows.
  release:
    needs: [changes, version, build]
    if: needs.changes.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE_VERSION: ${{ needs.version.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
      AWG_GO: ${{ needs.version.outputs.amneziawg_go }}
      AWG_TOOLS: ${{ needs.version.outputs.amneziawg_tools }}
      TOOLS_VERSION: ${{ needs.version.outputs.tools_version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the release tags are the build counter; credentials push the new one
          fetch-depth: 0

      - name: Create release tag
        run: |
          TAG="v${IMAGE_VERSION}"
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          if [[ -z "$DIGEST" ]]; then
            echo "::error::build job reported no image digest; not creating ${TAG}"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if ! git tag -l --format='%(contents)' "$TAG" | grep -x "run-id: ${GITHUB_RUN_ID}" >/dev/null; then
              echo "::error::Tag ${TAG} already exists and was not created by this run"
              exit 1
            fi
            echo "Tag ${TAG} was already created by this run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG" \
            -m "run-id: ${GITHUB_RUN_ID}" \
            -m "image: ${IMAGE}@${DIGEST}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        run: |
          TAG="v${IMAGE_VERSION}"
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — nothing to do."
            exit 0
          fi

          # The changelog starts at the release made by the run before this one.
          # Normally that is the current latest release; for a re-run of an
          # old run it is not, and this release must not become latest either.
          PREV=$(.github/scripts/release-tags.sh previous "$GITHUB_RUN_ID")
          SUPERSEDED=$(.github/scripts/release-tags.sh superseded "$GITHUB_RUN_ID")
          if [[ "$SUPERSEDED" == "true" ]]; then
            LATEST_FLAG="--latest=false"
            echo "::warning::A later run has already released $(.github/scripts/release-tags.sh latest); ${TAG} will not be marked as the latest release"
          else
            LATEST_FLAG="--latest"
          fi
          if [[ -n "$PREV" ]]; then
            CHANGES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$PREV" \
              --jq .body | sed 's/^## /#### /')
            if [[ "$(git rev-list -n1 "$PREV" 2>/dev/null)" == "$GITHUB_SHA" ]]; then
              CHANGES="Rebuild of the same source as ${PREV} (for example to pick up base image updates)."$'\n\n'"${CHANGES}"
            fi
          else
            CHANGES="First release using \`<amneziawg-tools>-r<build>\` versioning."
          fi
          BASE_IMAGE=$(awk '/^FROM /{img=$2} END{print img}' Dockerfile)

          cat > release-notes.md <<EOF
          ## AmneziaWG Docker Container ${TAG}

          ### Docker image

          | | |
          |---|---|
          | Version | \`${IMAGE_VERSION}\` |
          | Digest | \`${DIGEST}\` |
          | Commit | ${GITHUB_SHA} |
          | Platforms | linux/amd64, linux/arm64 |

          \`\`\`bash
          # this exact build (never changes)
          docker pull ${IMAGE}:${IMAGE_VERSION}
          docker pull ${IMAGE}@${DIGEST}
          # floating: newest build of amneziawg-tools ${TOOLS_VERSION} / newest build overall
          docker pull ${IMAGE}:${TOOLS_VERSION}
          docker pull ${IMAGE}:latest
          \`\`\`

          ### Upstream versions
          - **amneziawg-tools**: ${AWG_TOOLS}
          - **amneziawg-go**: ${AWG_GO}
          - **base image**: \`${BASE_IMAGE}\`

          ### Changes
          ${CHANGES}
          EOF

          # The API can fail (e.g. HTTP 504) after the release was in fact
          # created, so check before retrying.
          for attempt in 1 2 3; do
            if gh release create "$TAG" --verify-tag "$LATEST_FLAG" --title "$TAG" --notes-file release-notes.md; then
              break
            fi
            sleep 10
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release ${TAG} exists despite the error above — continuing."
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::Could not create release ${TAG}; re-run the failed jobs to retry"
              exit 1
            fi
          done
          echo "Created release [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}) for ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
