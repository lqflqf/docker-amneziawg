#       - PEERS=laptop,phone,tablet
#       - INTERNAL_SUBNET=10.13.13.0
#       - ALLOWEDIPS=0.0.0.0/0, ::/0
#       - PERSISTENTKEEPALIVE_PEERS=all
#     volumes:
#       - ./config:/config
#     ports:
#       - 51820:51820/udp
#     sysctls:
#       - net.ipv4.ip_forward=1
#       - net.ipv4.conf.all.src_valid_mark=1
#     restart: unless-stopped

