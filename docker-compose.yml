# Docker Compose for AmneziaWG
#
# Server Mode (auto-generate configs):
#   Set PEERS to enable server mode with automatic peer generation
#
# Client Mode (manual configs):
#   Don't set PEERS and mount your configs to /config/wg_confs/

services:
  amneziawg:
    image: ghcr.io/lqflqf/docker-amneziawg:latest
    container_name: amneziawg
    # Uncomment to build locally instead of using pre-built image
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
      # SYS_MODULE is rarely needed — the container never loads kernel modules, it
      # only detects an amneziawg module already loaded on the host. Keep it only
      # on minimal hosts that don't auto-load the iptables NAT modules.
      # - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Owner of ./config (numeric IDs) and timezone
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC

      # ---- Server Mode Configuration ----
      # Uncomment and configure for server mode
      # - SERVERURL=vpn.example.com         # External URL/IP (unset: detect the public IPv4)
      # - SERVERPORT=51820                  # Port advertised to peers; map it as SERVERPORT:51820/udp (the container always listens on 51820)
      # - PEERS=3                           # Number or names: 3 or laptop,phone,tablet
      # - INTERNAL_SUBNET=10.13.13.0        # VPN subnet
      # - ALLOWEDIPS=0.0.0.0/0, ::/0        # Allowed IPs for peers
      # - PERSISTENTKEEPALIVE_PEERS=all     # Which peers get keepalive: all (default), comma-separated, or none
      # - LOG_CONFS=false                   # true prints QR codes (they contain private keys) to the logs; use /app/show-peer instead

      # ---- Per-peer server AllowedIPs (site-to-site VPN) ----
      # - SERVER_ALLOWEDIPS_PEER_laptop=192.168.1.0/24

      # ---- AmneziaWG Protocol Version ----
      # - AWG_VERSION=2.0                   # "2.0" (default), "3.0" (header protection), "3.1" (3.0 + RandomTrailers) or "1.5" for legacy clients

      # ---- AmneziaWG obfuscation (optional) ----
      # Every value is generated on first start and saved; set one only to pin it.
      # Defaults and constraints: README "Protocol versions and obfuscation".
      # - AWG_JC=5                          # Junk packet count
      # - AWG_JMIN=50                       # Min junk packet size (< JMAX)
      # - AWG_JMAX=200                      # Max junk packet size (<= 1280)
      # - AWG_S1=86                         # Init packet padding
      # - AWG_S2=40                         # Response packet padding (S1 + 56 must not equal S2)
      # - AWG_S3=30                         # Cookie padding
      # - AWG_S4=16                         # Transport padding, keep <= 20 (see docs/mtu.md)
      # - AWG_H1=90666522-140666522         # Header values: non-overlapping ranges in 2.0+
      # - AWG_H2=623045912-673045912        # (integers make the Amnezia app report 1.5;
      # - AWG_H3=1210341563-1260341563      #  use them only with AWG_VERSION=1.5)
      # - AWG_H4=1820577390-1870577390
      # - AWG_I1=<b 0xc3><b 0x00000001><b 0x08><r 8><b 0x00><b 0x00><b 0x449e><r 4><r 1178>  # default (QUIC Initial)
      # - AWG_I2=                           # I2-I5: optional further signature packets

      # ---- AWG 3.x (only used when AWG_VERSION=3.0 or 3.1) ----
      # Timers are "lo-hi" ranges; each side picks its own value from the range.
      # - AWG_HEADER_PROTECTION_KEY=            # Shared key, must match on server and all clients (needs S1-S4 >= 12)
      # - AWG_CONTENT_PADDING=0                 # Extra padding per transport packet; 0 recommended (costs ~22% of download)
      # - AWG_REKEY_AFTER_TIME=110-130          # Seconds before the initiator rekeys
      # - AWG_REKEY_TIMEOUT=5-9                 # Handshake retransmit timeout, seconds
      # - AWG_REJECT_AFTER_TIME=180-200         # Keypair lifetime, seconds
      # - AWG_KEEPALIVE_TIMEOUT=10-18           # Keepalive interval when idle, seconds
      # - AWG_MAX_HANDSHAKE_ATTEMPTS=15-22      # Handshake retries before giving up

      # ---- AWG 3.1 interface switches (work with any AWG_VERSION) ----
      # Written to the server conf and every peer conf when set; unset = key not written.
      # Only "on" writes the key; "off" omits it (off is the default anyway) and is how you turn a switch back off.
      # - AWG_RANDOM_TRAILERS=on                # Random-length handshake packets. Defaults to "on" when AWG_VERSION=3.1. Must match on every end
      # - AWG_DISABLE_COOKIES=on                # No cookie-reply under load. Always opt-in; gives up DoS mitigation. Need not match

      # ---- DNS for peers (server mode) ----
      # Peers always use dnsmasq on the server's tunnel address; it forwards to DNS_UPSTREAM.
      # Further dnsmasq options: ./config/templates/dnsmasq.conf (README "DNS").
      # - DNS_UPSTREAM=1.1.1.1,1.0.0.1      # IPv4/IPv6, optional #port; e.g. 172.31.53.1 for Unbound on the host
    volumes:
      - ./config:/config
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped

