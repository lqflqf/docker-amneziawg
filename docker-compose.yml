# Docker Compose for the AmneziaWG server
#
# 1. Set PUID/PGID and, before the first start, SERVERURL.
# 2. docker compose up -d
# 3. Add a peer and show its QR code, then restart to apply it:
#      docker exec -it amneziawg awgctl peer add --name phone --qr
#      docker restart amneziawg
#
# The container reads the variables marked "first start" only once, when
# ./config has no database, and ignores them later. Then change the values
# with awgctl. README "Settings" and "Protocol versions and obfuscation" give
# each default and rule.

services:
  amneziawg:
    image: ghcr.io/lqflqf/docker-amneziawg:latest
    container_name: amneziawg
    # Remove the comment marks to build the image locally
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
      # The container never loads kernel modules. It only detects an amneziawg
      # module that the host loaded. Keep SYS_MODULE only on minimal hosts that
      # do not load the iptables NAT modules automatically.
      # - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # ---- Each start ----
      - PUID=1000                           # Owner of ./config and the database (numeric, not 0)
      - PGID=1000

      # ---- First start only (then: awgctl set <key> <value>) ----
      - SERVERURL=vpn.example.com           # server.endpoint_host. Change it before the first start: a DNS name or a fixed IP. Unset: detect the public IPv4 once
      # - SERVERPORT=51820                  # server.endpoint_port: the port that peers dial. Map it as SERVERPORT:51820/udp
      # - INTERNAL_SUBNET=10.13.13.0/24     # net.subnet: /24 only. .1 is the server
      # - ALLOWEDIPS=0.0.0.0/0, ::/0        # peer.default_allowed_ips: what peers send into the tunnel
      # - DNS_UPSTREAM=1.1.1.1,1.0.0.1      # dns.upstream: IPv4/IPv6, optional #port. For example 172.31.53.1 for Unbound on the host
      # - MTU=1280                          # net.mtu and net.peer_mtu: 576-1500 or none (docs/mtu.md)

      # ---- AmneziaWG, first start only (then: awgctl awg version|set|regenerate) ----
      # - AWG_VERSION=3.1                   # 3.1 (default), 3.0, 2.0 (AmneziaVPN 4.8.12.9+) or 1.5 for legacy apps
      # The container makes each value below. Set one only to pin it, for example:
      # - AWG_JC=5                          # also AWG_JMIN, AWG_JMAX
      # - AWG_S1=16                         # also AWG_S2-AWG_S4. With RandomTrailers, S1 = S2 = S3 = S4
      # - AWG_H1=90666522-140666522         # also AWG_H2-AWG_H4: ranges that do not overlap (2.0+)
      # - AWG_I2=<r 64>                     # also AWG_I1, AWG_I3-AWG_I5: signature packets
      # - AWG_HEADER_PROTECTION_KEY=        # 3.x: also AWG_CONTENT_PADDING, AWG_REKEY_AFTER_TIME, AWG_REKEY_TIMEOUT,
      #                                     # AWG_REJECT_AFTER_TIME, AWG_KEEPALIVE_TIMEOUT, AWG_MAX_HANDSHAKE_ATTEMPTS
      # - AWG_RANDOM_TRAILERS=on            # on/off. Default on for 3.1, off for the other versions
      # - AWG_DISABLE_COOKIES=on            # on/off. Default off. Removes the WireGuard DoS protection
    volumes:
      - ./config:/config                    # amneziawg.db (all keys: keep it private)
    ports:
      - 51820:51820/udp                     # SERVERPORT:51820/udp
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped                 # A fatal error at start stops the container. This policy starts it again
