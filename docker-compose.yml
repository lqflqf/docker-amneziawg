# Docker Compose for the AmneziaWG server
#
# 1. Set PUID/PGID/TZ and, before the first start, SERVERURL.
# 2. docker compose up -d
# 3. Add a peer and show its QR code:
#      docker exec -it amneziawg awgctl peer add phone --qr
#
# The container reads the variables marked "first start" only once, when
# ./config has no database. Later, change these values with awgctl
# (README "Settings" and "Protocol versions and obfuscation"). A changed
# variable only gives a WARNING with the awgctl command to use.

services:
  amneziawg:
    image: ghcr.io/lqflqf/docker-amneziawg:latest
    container_name: amneziawg
    # Remove the comment marks to build the image locally
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
      # The container never loads kernel modules. It only detects an amneziawg
      # module that the host loaded. Keep SYS_MODULE only on minimal hosts that
      # do not load the iptables NAT modules automatically.
      # - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # ---- Each start ----
      - PUID=1000                           # Owner of ./config and the database (numeric, not 0)
      - PGID=1000
      - TZ=Etc/UTC                          # Time zone of the log

      # ---- First start only (then: awgctl set <key> <value>) ----
      - SERVERURL=vpn.example.com           # server.endpoint_host. Change it before the first start: a DNS name or a fixed IP. Unset: detect the public IPv4 once
      # - SERVERPORT=51820                  # server.endpoint_port: the port that peers dial. Map it as SERVERPORT:51820/udp
      # - INTERNAL_SUBNET=10.13.13.0/24     # net.subnet: /24 only. .1 is the server
      # - ALLOWEDIPS=0.0.0.0/0, ::/0        # peer.default_allowed_ips: what peers send into the tunnel
      # - DNS_UPSTREAM=1.1.1.1,1.0.0.1      # dns.upstream: IPv4/IPv6, optional #port. For example 172.31.53.1 for Unbound on the host
      # - MTU=1280                          # net.mtu and net.peer_mtu: 576-1500 or none (docs/mtu.md)

      # ---- AmneziaWG, first start only (then: awgctl awg version|set|regenerate) ----
      # - AWG_VERSION=3.1                   # 3.1 (default), 3.0, 2.0 (AmneziaVPN 4.8.12.9+) or 1.5 for legacy apps
      # The container makes each value below. Set one only to pin it.
      # Defaults and rules: README "Protocol versions and obfuscation".
      # - AWG_JC=5                          # Junk packet count
      # - AWG_JMIN=50                       # Minimum junk packet size (< AWG_JMAX)
      # - AWG_JMAX=200                      # Maximum junk packet size (<= 1280)
      # - AWG_S1=16                         # Init packet padding. With RandomTrailers, S1 = S2 = S3 = S4
      # - AWG_S2=16                         # Response packet padding (S1 + 56 must not equal S2)
      # - AWG_S3=16                         # Cookie padding
      # - AWG_S4=16                         # Transport padding, keep <= 20 (docs/mtu.md)
      # - AWG_H1=90666522-140666522         # Header ranges that do not overlap (2.0+).
      # - AWG_H2=623045912-673045912        # Integers make the Amnezia app show 1.5.
      # - AWG_H3=1210341563-1260341563
      # - AWG_H4=1820577390-1870577390
      # - AWG_I1=<b 0xc3><b 0x00000001><b 0x08><r 8><b 0x00><b 0x00><b 0x449e><r 4><r 1178>  # default (QUIC Initial)
      # - AWG_I2=<r 64>                     # I2-I5: optional signature packets (need I1)

      # ---- AWG 3.x (AWG_VERSION=3.0 or 3.1) ----
      # Timers are "lo-hi" ranges. Each end selects its own value from the range.
      # - AWG_HEADER_PROTECTION_KEY=        # Base64 32-byte key, the same on each end (needs S1-S4 >= 12)
      # - AWG_CONTENT_PADDING=0             # Must be 0 with RandomTrailers. Padding costs about 22% of download
      # - AWG_REKEY_AFTER_TIME=110-130
      # - AWG_REKEY_TIMEOUT=5-9
      # - AWG_REJECT_AFTER_TIME=180-200
      # - AWG_KEEPALIVE_TIMEOUT=10-18
      # - AWG_MAX_HANDSHAKE_ATTEMPTS=15-22

      # ---- AWG 3.1 switches (on/off) ----
      # - AWG_RANDOM_TRAILERS=on            # Default on for 3.1, off for the other versions. Not with 1.5. The same on each end
      # - AWG_DISABLE_COOKIES=on            # Default off. Removes the WireGuard DoS protection. Can be different on each end
    volumes:
      - ./config:/config                    # amneziawg.db (all keys: keep it private), backups/
    ports:
      - 51820:51820/udp                     # SERVERPORT:51820/udp
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0    # The IPv6 FORWARD DROP rules need IPv6
    restart: unless-stopped                 # A fatal error at start stops the container. This policy starts it again
