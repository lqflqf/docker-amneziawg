server:
    # Drops to abc (PUID) once port 53 is bound. /config/unbound is owned by abc.
    username: "abc"
    directory: "/config/unbound"
    use-syslog: no
    val-log-level: 2

    # interface, access-control and ip-freebind are generated at every start
    # from INTERNAL_SUBNET: loopback plus the tunnel address and subnet only.
    include: "/run/unbound/listen.conf"

    do-ip6: no
    so-sndbuf: 0
    prefetch: yes
    prefetch-key: yes

    auto-trust-anchor-file: "/config/unbound/root.key"
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    local-zone: "health.amneziawg." static
    local-data: "health.amneziawg. IN A 127.0.0.1"

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1#one.one.one.one
    forward-addr: 1.0.0.1#one.one.one.one
