# golangci-lint v2 (pinned in .github/workflows/docker-build.yml).
version: "2"
linters:
  settings:
    errcheck:
      # Best-effort cleanup and console output: a failure there changes nothing.
      exclude-functions:
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*github.com/lqflqf/docker-amneziawg/internal/store.DB).Close
        - syscall.Flock
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1008"]
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
